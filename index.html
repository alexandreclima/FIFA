<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copa do Mundo 2026 - Acompanhamento</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="trophy">🏆</span>
      <div>
        <h1>Copa do Mundo 2026</h1>
        <span id="last-update" class="last-update">Aguardando primeira atualização...</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="grupos">Fase de Grupos</button>
      <button class="tab-btn" data-tab="mata">Mata-Mata</button>
      <button class="tab-btn" data-tab="campeao">Campeão</button>
    </nav>
  </header>

  <main>
    <section id="grupos" class="tab-panel active">
      <div class="actions">
        <button id="btn-atualizar" class="primary">⟳ Atualizar Resultados (API)</button>
        <button id="btn-simular-grupos" class="secondary">⚽ Simular Jogos Pendentes</button>
        <button id="btn-reset" class="secondary">↺ Reiniciar</button>
      </div>
      <div id="groups-container" class="groups-grid">
        <div class="empty-state">Clique em <strong>Atualizar Resultados</strong> para carregar os dados reais da Copa 2026.</div>
      </div>
    </section>

    <section id="mata" class="tab-panel">
      <div class="actions">
        <button id="btn-atualizar-ko" class="primary">⟳ Atualizar Resultados (API)</button>
        <button id="btn-simular-fase" class="secondary">▶ Simular Próxima Fase</button>
        <button id="btn-simular-tudo" class="secondary">⏩ Simular Até a Final</button>
      </div>
      <div id="bracket" class="bracket">
        <div class="empty-state">O chaveamento aparece após a fase de grupos.</div>
      </div>
    </section>

    <section id="campeao" class="tab-panel">
      <div id="champion-area" class="champion-area">
        <p class="empty-msg">O campeão será revelado quando a final for jogada.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
